[package]
name = "ardu-deck"
version = "0.1.0"
authors = ["Foraminiferatrv <ione.trv@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ardu-deck"
test = false
bench = false

[dependencies]
panic-halt = "1.0.0"
ufmt = "0.2.0"
nb = "1.1.0"
embedded-hal = "1.0"
lcd_1602_i2c = "0.3.0"
i2c-character-display =  { version = "0.5.1", features = ["ufmt"] }
log = "0.4.25"
defmt = "1.1.1"
avr-device = "0.8.1"
embedded-hal-bus = "0.3.0"
lcd1602-driver = "0.3.0"
heapless = "0.9.3"
numtoa = "1.0.0"


[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-nano"]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
